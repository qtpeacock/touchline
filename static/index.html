<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Touchline — soccer coaching platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!-- Arrowheads shared by every board on the page: one per surface (grass / whiteboard) and arrow kind. -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <marker id="head-grass-move" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ffffff"/></marker>
      <marker id="head-grass-pass" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ffd76a"/></marker>
      <marker id="head-grass-dribble" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ffffff"/></marker>
      <marker id="head-blank-move" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f3a30"/></marker>
      <marker id="head-blank-pass" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker>
      <marker id="head-blank-dribble" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1f3a30"/></marker>
    </defs>
  </svg>
  <div id="app"><p class="loading">Loading…</p></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
